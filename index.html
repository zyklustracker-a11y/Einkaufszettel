<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover is what makes env(safe-area-inset-*) report real values on iPhone -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <title>Receipt AI</title>
    <meta name="description" content="Scanne deine Kassenzettel, verstehe deine Ausgaben." />

    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Home-screen install on iOS Safari -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Receipt AI" />
    <!--
      NOT black-translucent. That let the app paint under the status bar, but in
      an installed PWA iOS then reports a layout viewport that is inset-top
      shorter than the screen while still anchoring it at the very top — so the
      bottom 59pt of the screen were unreachable: a strip under the tab bar that
      renders background but no content. `default` insets the web view below the
      status bar instead, and the viewport reaches the bottom edge again.
      The status bar area itself is filled from theme-color below.
    -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#F4F5F3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0E1110" media="(prefers-color-scheme: dark)" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
