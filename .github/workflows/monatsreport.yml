# Ruft am zweiten Tag jedes Monats die Edge Function „monatsreport" auf.
#
# ----------------------------------------------------------------------------
# WARUM GITHUB ACTIONS UND NICHT PG_CRON
#
# Supabase bringt `pg_cron` mit, und damit ließe sich der Aufruf in der Datenbank
# planen. Dafür müsste dort aber der Dienstschlüssel hinterlegt werden (im Vault
# oder als Einstellung), und ein zweiter Ort für ein Geheimnis ist ein zweiter
# Ort, an dem es verloren gehen kann. GitHub Actions ist ohnehin schon
# eingerichtet, kostet nichts und zeigt jeden Lauf mit Protokoll an.
#
# ----------------------------------------------------------------------------
# WARUM AM ZWEITEN UND NICHT AM ERSTEN
#
# Ein Bon vom Monatsletzten wird oft erst am nächsten Tag gescannt. Ein Report
# am Ersten müsste sich später korrigieren — und eine Push-Meldung lässt sich
# nicht zurücknehmen.
#
# ----------------------------------------------------------------------------
# EINMALIG EINZURICHTEN: zwei Geheimnisse im GitHub-Repository
#
# GitHub → Settings → Secrets and variables → Actions → New repository secret
#
#   SUPABASE_URL     Supabase → Project Settings → Data API → Project URL,
#                    also https://DEIN-PROJEKT.supabase.co
#
#   REPORT_SECRET    Eine selbst ausgedachte Zeichenfolge. Sie muss in Supabase
#                    unter Project Settings → Edge Functions → Secrets denselben
#                    Wert haben. Erzeugen zum Beispiel mit:
#                        node -e "console.log(crypto.randomUUID())"
#
# Ohne dieses Geheimnis antwortet die Funktion mit 401 — sonst könnte jeder, der
# die Adresse kennt, der ganzen Familie eine Meldung schicken.
# ----------------------------------------------------------------------------

name: Monatsreport verschicken

on:
  schedule:
    # 07:00 UTC am 2. jedes Monats — in Deutschland also 8 oder 9 Uhr morgens,
    # je nach Sommerzeit. Cron kennt keine Zeitzonen; eine Stunde Unschärfe ist
    # für eine Monatsmeldung ohne Bedeutung.
    - cron: '0 7 2 * *'
  # Zum Ausprobieren: GitHub → Actions → diesen Workflow → Run workflow.
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest

    steps:
      - name: Report anstoßen
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          REPORT_SECRET: ${{ secrets.REPORT_SECRET }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$REPORT_SECRET" ]; then
            echo "SUPABASE_URL oder REPORT_SECRET fehlt in den GitHub-Secrets."
            exit 1
          fi

          # `-w` hängt den Status an die Ausgabe an; `-f` würde den Körper
          # verschlucken, und genau der enthält die Zählung.
          antwort=$(curl -sS -X POST \
            -H "x-report-secret: $REPORT_SECRET" \
            -H "Content-Type: application/json" \
            -w '\n%{http_code}' \
            "$SUPABASE_URL/functions/v1/monatsreport")

          status=$(echo "$antwort" | tail -n1)
          echo "$antwort" | head -n-1

          if [ "$status" != "200" ]; then
            echo "Die Funktion antwortete mit $status."
            exit 1
          fi
